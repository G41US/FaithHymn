name: Build APK

# Every push to main builds FaithHymns 3.0.<run>. When the signing secrets are set,
# it is also published as a GitHub release, which the in-app "Check for updates" picks up.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 3.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME --no-daemon
          mv app/build/outputs/apk/release/app-release.apk FaithHymns-$VERSION_NAME.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FaithHymns-apk
          path: FaithHymns-*.apk

      - name: Publish release (in-app update)
        if: env.HAS_KEY == 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: FaithHymns ${{ env.VERSION_NAME }}
          body: ${{ github.event.head_commit.message }}
          files: FaithHymns-*.apk
          make_latest: true

      - name: Unsigned build warning
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Signing secrets not set - APK is debug-signed and NOT published as an update."
